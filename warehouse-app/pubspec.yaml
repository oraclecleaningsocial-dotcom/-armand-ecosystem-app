name: warehouse_app
description: >
  Gestione magazzino offline-first con scansione barcode/QR, movimenti di
  entrata/uscita, anagrafica prodotti e alert scorte basse.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistenza locale (offline-first)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Scansione barcode/QR via fotocamera, 100% offline (ML Kit / Vision)
  mobile_scanner: ^5.2.3

  # Foto prodotto (scatto o galleria) salvata in locale
  image_picker: ^1.1.2

  # Notifiche locali per scorte basse (nessun server richiesto)
  flutter_local_notifications: ^17.2.2

  # State management leggero
  provider: ^6.1.2

  # Formattazione date/ore in italiano
  intl: ^0.19.0

  # Condivisione file di export (CSV) tramite il pannello di condivisione
  # nativo del sistema operativo: nessuna rete richiesta dalla chiamata in sé
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
