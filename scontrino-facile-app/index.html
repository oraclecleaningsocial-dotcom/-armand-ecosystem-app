<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages tiene questo file in cache lato CDN per un po': in un'app che si
         aggiorna spesso, un'icona sulla Home o una scheda Safari rimasta aperta possono
         mostrare a lungo una versione vecchia senza che sembri un problema. Questi due
         meta dicono al browser di non tenerne una copia locale, così una riapertura
         normale (senza bisogno di reinstallare l'icona) basta a vedere l'ultima versione. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e14" />
    <title>ScontrinoFacile</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scontrini" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
